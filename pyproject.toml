[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[project]
name = "pygrondig"
description = "ASGI server that spawns grondig to compute Linux Kernel vulnerabilities"
readme = "README.md"
authors = [
    {name = "Jorge Marques", email="jorge.marques@analog.com"}
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Uvicorn",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "uvicorn",
    "schedule",
]
requires-python = ">=3.9"
dynamic = ["version"]

[tool.flit.module]
name = "pygrondig"

[project.scripts]
pygrondig = "pygrondig.__main__:main"
