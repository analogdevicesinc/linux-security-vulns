name: Check CVEs on artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, SHA reference'
        required: true
        type: string
      repository:
        description: "Repository"
        type: choice
        options:
        - adi/linux
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: 'adi/linux'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: cloudsmith-io/cloudsmith-cli-action@v1.0.5
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG != '' && env.CLOUDSMITH_SERVICE_SLUG != ' ' }}
      with:
        oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
        oidc-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
        oidc-auth-only: 'true'

    - name: Cloudsmith API Key
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG == '' || env.CLOUDSMITH_SERVICE_SLUG == ' ' }}
      run: |
        CLOUDSMITH_API_KEY=$(echo "${{ secrets.CLOUDSMITH_API_KEY }}" | xargs)
        echo "CLOUDSMITH_API_KEY=$CLOUDSMITH_API_KEY" >> "$GITHUB_ENV"

    - name: Get artifacts
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux/ci-adapter/$1
        }

        mkdir -p ci
        get_file ci/lib.sh
        get_file ci/download_artifacts.sh

        export SKIP_DIST="true"
        export SKIP_EXPAND_MICROBLAZE="true"
        export SKIP_EXPAND_NIOS2="true"

        source ci/download_artifacts.sh

        download_artifacts "${{ inputs.ref }}" "${{ inputs.repository }}"

        source $(find raw -name context.txt | head -1)
        tag=$(echo "$kernel_release" | sed -E 's/-g[0-9a-f]+$//; s/\.0($|-rc)/\1/; s/^/v/')
        cc_files="$(find raw -name compile_commands.json)"

        echo "tag=$tag">> "$GITHUB_ENV"
        echo "cc_files<<EOF" >> $GITHUB_ENV
        echo "$cc_files" >> "$GITHUB_ENV"
        echo "EOF" >> $GITHUB_ENV

    - uses: analogdevicesinc/linux-security-vulns/check-tag@ci
      id: check
      with:
        tag: ${{ env.tag }}

    - name: Restore CVE db
      uses: actions/cache/restore@v5
      with:
        key: linux-security-vulns
        path: |
          cve-files.db
        fail-on-cache-miss: true

    - name: Check artifacts
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        cve_all=$(mktemp)
        echo '${{ steps.check.outputs.cves }}' > $cve_all

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/${{ github.repository }}/ci/$1
        }

        get_file filter-cve-list.py

        echo "## CVEs in $tag per defconfig" >> $GITHUB_STEP_SUMMARY

        while IFS= read -r file; do
          [[ -n "$file" ]] || continue

          cve_out=$(mktemp)
          python3 filter-cve-list.py "$file" "$cve_all" "$cve_out"

          len=$(cat "$cve_out" | jq length)
          echo "### $file: $len" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | | | | | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|-|-|-|-|" >> $GITHUB_STEP_SUMMARY
          cat "$cve_out" | jq -r '
            . as $in |
            range(0; length; 6) |
            $in[.:.+6] |
            "| " + (map(.) | join(" | ")) + " |"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          rm "$cve_out"
        done <<< "$cc_files"


        rm "$cve_all"
