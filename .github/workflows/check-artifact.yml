name: Check CVEs on artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git reference'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: cloudsmith-io/cloudsmith-cli-action@v1.0.5
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG != '' && env.CLOUDSMITH_SERVICE_SLUG != ' ' }}
      with:
        oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
        oidc-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
        oidc-auth-only: 'true'

    - name: Cloudsmith API Key
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG == '' || env.CLOUDSMITH_SERVICE_SLUG == ' ' }}
      run: |
        CLOUDSMITH_API_KEY=$(echo "${{ secrets.CLOUDSMITH_API_KEY }}" | xargs)
        echo "CLOUDSMITH_API_KEY=$CLOUDSMITH_API_KEY" >> "$GITHUB_ENV"

    - name: Get artifacts
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux/ci-adapter/$1
        }

        mkdir -p ci
        get_file ci/lib.sh
        get_file ci/download_artifacts.sh

        export SKIP_DIST="true"
        export SKIP_EXPAND_MICROBLAZE="true"
        export SKIP_EXPAND_NIOS2="true"

        source ci/download_artifacts.sh
        download_artifacts "${{ inputs.ref }}" "adi/linux"

        source $(find raw -name context.txt | head -1)
        tag=$(echo "$kernel_release" | sed -E 's/-g[0-9a-f]+$//; s/\.0($|-rc)/\1/; s/^/v/')
        compile_commands="$(find raw -name compile_commands.json)"

        echo "tag=$tag">> "$GITHUB_ENV"
        echo "compile_commands<<EOF" >> $GITHUB_ENV
        echo "$compile_commands" >> "$GITHUB_ENV"
        echo "EOF" >> $GITHUB_ENV

    - name: Clone vulns/cve/published
      run: |
        git clone --depth 1 --no-checkout --filter=blob:none \
            https://git.kernel.org/pub/scm/linux/security/vulns.git \
            vulns
        cd vulns
        git sparse-checkout set cve/published
        git checkout

    - name: Restore artifacts
      uses: actions/cache/restore@v5
      with:
        key: cve-db-${{ github.sha }}
        restore-keys: cve-db-
        path: |
          vulns/tools/target/release/strak
          vulns/tools/verhaal/verhaal.db
          cve-files.db
        fail-on-cache-miss: true

    - name: Check tag
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/${{ github.repository }}/ci/$1
        }

        get_file get-cve-list.sh
        get_file filter-cve-list.py

        chmod +x vulns/tools/target/release/strak

        cve_all=$(mktemp)
        source ./get-cve-list.sh

        get-cve-list "$tag" "$cve_all"

        cat "$cve_all" | wc -l

        echo "cve_all=$cve_all" >> $GITHUB_ENV

    - name: Check artifacts
      run: |
        cves_all=""

        while IFS= read -r file; do
          [[ -n "$file" ]] || continue
          echo -n "$file "
          cves=$(python3 filter-cve-list.py "$cve_all" "$file" | sed '/^$/d' | sort -u)
          cves_all="${cves_all}"$'\n'"${cves}"

          echo "$cves" | wc -l
          echo "$cves"
        done <<< "$compile_commands"

        unique_cves=$(echo "$cves_all" | sed '/^$/d' | sort -u)

        echo "Got ($(echo "$unique_cves" | wc -l)) unique CVEs:" >> $GITHUB_STEP_SUMMARY
        echo "$unique_cves" >> $GITHUB_STEP_SUMMARY
