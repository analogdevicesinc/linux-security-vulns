name: CVE artifact scan
run-name: CVE artifact scan ${{ inputs.repository }}@${{ inputs.ref }}
# This is a DEMO workflow, at scale, you maintain verhaal.db, post.db, and osv'
# as proper databases and query them directly.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, SHA reference'
        required: true
        type: string
      repository:
        description: "Repository"
        type: choice
        options:
        - adi/linux
      url:
        description: "Grondig endpoint url"
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: 'adi/linux'
      url:
        required: false
        type: string
        default: ''
    secrets:
      NVD_API_KEY:
        required: false
      CLOUDSMITH_API_KEY:
        required: false
      CLOUDSMITH_SERVICE_SLUG:
        required: false
    outputs:
      sha:
        value: ${{ jobs.check.outputs.sha }}
      result:
        value: ${{ jobs.check.outputs.result }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.get-artifacts.outputs.sha }}
      result: ${{ steps.check.outputs.result }}
      result-file: ${{ steps.check.outputs.result-file }}

    steps:
    - uses: cloudsmith-io/cloudsmith-cli-action@v1.0.5
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG != '' && env.CLOUDSMITH_SERVICE_SLUG != ' ' }}
      with:
        oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
        oidc-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
        oidc-auth-only: 'true'

    - name: Cloudsmith API Key
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      if: ${{ env.CLOUDSMITH_SERVICE_SLUG == '' || env.CLOUDSMITH_SERVICE_SLUG == ' ' }}
      run: |
        CLOUDSMITH_API_KEY=$(echo "${{ secrets.CLOUDSMITH_API_KEY }}" | xargs)
        echo "CLOUDSMITH_API_KEY=$CLOUDSMITH_API_KEY" >> "$GITHUB_ENV"

    - name: Get artifacts
      id: get-artifacts
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux/ci/$1
        }

        mkdir -p ci
        get_file ci/lib.sh
        get_file ci/download_artifacts.sh

        export SKIP_DIST="true"
        export SKIP_EXPAND_MICROBLAZE="true"
        export SKIP_EXPAND_NIOS2="true"

        source ci/download_artifacts.sh

        download_artifacts "${{ inputs.ref }}" "${{ inputs.repository }}"

        context="$(find raw -name context.txt | head -1)"
        [[ -n "$context" ]] || { echo "::error ::get-articats: failed to find context.txt" ; exit 1 ; }

        source "$context"
        # Adapt fine version with upstream tag
        # Build                      Upstream
        # 6.12.77+                   v6.12.77
        # 6.12.77-v8-16k+            v6.12.77
        # 6.12.77-gc8d83c0ff29a      v6.12.77
        # 6.12.0+                    v6.12
        # 6.12.0-v8-16k+             v6.12
        # 6.12.0-gc8d83c0ff29a       v6.12
        # 6.12.0-rc7+                v6.12-rc7
        # 6.12.0-rc7-v8-16k+         v6.12-rc7
        # 6.12.0-rc7-gc8d83c0ff29a   v6.12-rc7
        tag=$(echo "$kernel_release" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?(-rc[0-9]+)?).*/\1/; s/\.0($|-rc)/\1/; s/^/v/')
        cc_files="$(find raw -name sbom.spdx30.json)"
        [ -n "$cc_files" ] || cc_files="$(find raw -name compile_commands.json)"

        # Since it is the same ref, the cherry-pick list is the same for all SBOMs.
        cherry_picks=""
        sbom_file=$(find raw -name sbom.spdx30.json | head -1)
        if [ -n "$sbom_file" ]; then
          cherry_picks=$(jq -r '[.["@graph"][]? | .extension[]? | select(.type == "extension_CdxPropertiesExtension") | .extension_cdxProperty[]? | select(.extension_cdxPropName == "git:cherry-pick") | .extension_cdxPropValue] | join(",")' "$sbom_file")
        else
          sbom_file=$(find raw -name sbom.cdx17.json | head -1)
          [ -n "$sbom_file" ] && cherry_picks=$(jq -r '[.metadata.component.pedigree.commits[]?.uid // empty] | join(",")' "$sbom_file")
        fi

        echo "sha=$git_sha" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_ENV"
        echo "cherry_picks=$cherry_picks" >> "$GITHUB_ENV"
        echo "cc_files<<EOF" >> $GITHUB_ENV
        echo "$cc_files" >> "$GITHUB_ENV"
        echo "EOF" >> $GITHUB_ENV

    - name: Build request
      id: build
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o build-grondig-request.py \
            https://raw.githubusercontent.com/analogdevicesinc/linux-security-vulns/ci/build-grondig-request.py

        echo "$cc_files" | python3 build-grondig-request.py \
            --tag "$tag" \
            --cherry-picks "$cherry_picks" \
            > grondig-request.json

    - uses: analogdevicesinc/linux-security-vulns/check@ci
      id: check
      with:
        request-file: grondig-request.json
        url: ${{ inputs.url }}

    - name: Create summary
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        result=$(cat grondig-result.json)

        echo "## CVEs in $tag per defconfig" >> $GITHUB_STEP_SUMMARY
        echo "$result" | jq -c 'to_entries[]' | while IFS= read -r entry; do
          file=$(echo "$entry" | jq -r '.key')
          cves=$(echo "$entry" | jq -c '.value.cves')
          len=$(echo "$cves" | jq length)

          echo "### $file: $len" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | | | | | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|-|-|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "$cves" | jq -r '
            . as $in |
            range(0; length; 6) |
            $in[.:.+6] |
            "| " + join(" | ") + " |"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done
