name: Build CVE database
run-name: Build security vulnerabilities database
on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgit2-dev just meson cargo

    - name: Build
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux-security-vulns/ci/$1
        }

        get_file build-cve-db.sh
        get_file build-cve-files-db.py
        get_file build-dyads-db.py

        source ./build-cve-db.sh
        build-cve-db
        python3 build-cve-files-db.py
        python3 build-dyads-db.py

    - name: Save CVE db to cache
      uses: actions/cache/save@v5
      with:
        key: linux-security-vulns-${{ github.run_id }}
        path: |
          vulns/tools/target/release/strak
          vulns/tools/target/release/grondig
          vulns/tools/verhaal/verhaal.db
          cve-files.db
          dyads.db
