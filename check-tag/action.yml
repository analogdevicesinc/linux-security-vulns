name: Check CVEs
description: Get CVE list of kernel tag

inputs:
  tag:
    description: "Kernel version tag"
    default: ''
  gh-token:
    description: "GitHub Token"
    default: ${{ github.token }}

outputs:
  cves:
    description: "List of cves"
    value: ${{ steps.check.outputs.cves }}

runs:
  using: composite
  steps:
    - name: Restore artifacts
      uses: actions/cache/restore@v5
      with:
        key: linux-security-vulns-${{ github.run_id }}
        restore-keys: linux-security-vulns-
        path: |
          vulns/tools/target/release/strak
          vulns/tools/target/release/grondig
          vulns/tools/verhaal/verhaal.db
          cve-files.db
          dyads.db
        fail-on-cache-miss: true

    - name: Restore dyad files
      shell: bash
      run: |
        get_file () {
          curl -sL -H "Authorization: Bearer ${{ inputs.gh-token }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux-security-vulns/ci/$1
        }
        get_file restore-dyads.py

        python3 restore-dyads.py dyads.db vulns/cve/published

    - name: Check
      id: check
      shell: bash
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        get_file () {
          curl -sL -H "Authorization: Bearer ${{ inputs.gh-token }}" -o $1 \
              https://raw.githubusercontent.com/analogdevicesinc/linux-security-vulns/ci/$1
        }

        get_file get-cve-list.sh

        chmod +x vulns/tools/target/release/grondig

        cve_all=$(mktemp)
        source ./get-cve-list.sh

        get-cve-list "${{ inputs.tag }}" "$cve_all"

        echo "cves=$(cat $cve_all)">> $GITHUB_OUTPUT
        rm "$cve_all"
